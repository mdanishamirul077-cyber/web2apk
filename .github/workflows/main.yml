name: Build APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL Website'
        required: false
      app_name:
        description: 'Nama Aplikasi'
        required: true
      package_name:
        description: 'Package Name'
        required: true
      user_id:
        description: 'User ID'
        required: true
      zip_url:
        description: 'URL ZIP Flutter'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Download ZIP
        if: inputs.zip_url != ''
        run: |
          wget -O project.zip "${{ inputs.zip_url }}"
          unzip project.zip -d app/

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
