name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Flutter project
        id: flutter_project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -name "pubspec.yaml" -not -path "./.git/*" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            echo "Isi repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "Flutter project ditemukan di: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "APK hasil build:"
          find . -type f -name "*.apk" -not -path "./.git/*" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_type }}
          path: "**/build/app/outputs/flutter-apk/*.apk"
          if-no-files-found: error
